name: Rebuild pinned farming data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_data.py'
      - 'tools/fetch_data.py'
      - '.github/workflows/data.yml'
permissions:
  contents: write
concurrency:
  group: farming-data
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download only pinned, hash-checked source data
        run: python3 tools/fetch_data.py
      - name: Parse literal data and build the offline addon database
        run: python3 tools/build_data.py --world data-source/tomes.json --questie data-source/questie --output EbonTomeFarm/Data.lua
      - name: Commit only the generated database and coverage report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EbonTomeFarm/Data.lua docs/data-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild pinned native farming database and coverage report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: |
            EbonTomeFarm/Data.lua
            docs/data-report.json
          retention-days: 30
