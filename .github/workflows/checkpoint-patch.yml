name: Apply tested compatibility checkpoint
on:
  push:
    branches: [main]
    paths: ['tools/checkpoint.patch']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the reviewed source and regression-test patch atomically
        run: git apply --check tools/checkpoint.patch && git apply tools/checkpoint.patch
      - name: Validate original-client compatibility
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          find EbonTomeFarm tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test.lua
      - name: Persist tested source and remove the one-time patch runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EbonTomeFarm/Import.lua EbonTomeFarm/Navigation.lua tests/wow_mock.lua tests/test.lua
          git rm tools/checkpoint.patch .github/workflows/checkpoint-patch.yml
          git commit -m 'Fix plain-name imports and original 3.3.5 map setter offset; add 3 regressions'
          git pull --rebase origin main
          git push origin HEAD:main
