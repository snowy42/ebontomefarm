name: Test and package addon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: addon-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install original-client Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Lua 5.1 syntax validation
        run: find EbonTomeFarm tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Run addon regression tests
        run: lua5.1 tests/test.lua
      - name: Run distribution and data-parser tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package and verify standalone install
        run: |
          python3 tools/package.py
          cd dist && sha256sum -c SHA256SUMS.txt
      - name: Preserve an exact source checkpoint
        if: always()
        run: |
          mkdir -p dist
          git archive --format=zip HEAD -o dist/ebontomefarm-source.zip
          git rev-parse HEAD > dist/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EbonTomeFarm-build-${{ github.sha }}
          path: dist/*
          retention-days: 30
