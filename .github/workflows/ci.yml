name: Test and package addon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: addon-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install original-client Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Lua 5.1 syntax validation
        run: find EbonTomeFarm tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Run addon regression tests
        run: lua5.1 tests/test.lua
      - name: Preserve an exact source checkpoint
        if: always()
        run: |
          mkdir -p /tmp/ebontomefarm-artifacts
          git archive --format=zip HEAD -o /tmp/ebontomefarm-artifacts/ebontomefarm-source.zip
          git rev-parse HEAD > /tmp/ebontomefarm-artifacts/COMMIT.txt
      - name: Package installable addon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('/tmp/ebontomefarm-artifacts/EbonTomeFarm.zip', 'w', ZIP_DEFLATED) as z:
              for p in sorted(Path('EbonTomeFarm').rglob('*')):
                  if p.is_file():
                      z.write(p, p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EbonTomeFarm-build-${{ github.sha }}
          path: /tmp/ebontomefarm-artifacts/*
          retention-days: 30
