name: Apply tested reset-routing-alert checkpoint
on:
  push:
    branches: [main]
    paths: ['tools/v102-patch.json']
permissions:
  contents: write
concurrency:
  group: v102-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and verify the exact locally tested source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          meta = json.loads(Path('tools/v102-patch.json').read_text())
          parts = ['tools/v102-part1.txt','tools/v102-part2.txt','tools/v102-part3.txt','tools/v102-part4.txt']
          data = lzma.decompress(base64.b64decode(''.join(Path(p).read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(data).hexdigest() == meta['sha256'], 'Source patch checksum mismatch'
          Path('/tmp/v102.patch').write_bytes(data)
          PY
          git apply --check /tmp/v102.patch
          git apply /tmp/v102.patch
          if git diff --name-only | grep '^.github/'; then exit 1; fi
      - name: Run all 81 tests, compile and verify the install ZIP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          find EbonTomeFarm tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test.lua
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/package.py
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Persist only tested source and remove transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EbonTomeFarm tests README.md PROJECT_HANDOVER.md docs/RELEASE_NOTES.md docs/TESTING.md
          git rm tools/v102-patch.json tools/v102-part1.txt tools/v102-part2.txt tools/v102-part3.txt tools/v102-part4.txt
          git commit -m 'v1.0.2: reset manual build progress, nearest-zone routing and queued tome-found alerts; 81 tests'
          git pull --rebase origin main
          git push origin HEAD:main
          git archive --format=zip HEAD -o dist/ebontomefarm-source.zip
          git rev-parse HEAD > dist/COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EbonTomeFarm-v102-tested-checkpoint
          path: dist/*
          retention-days: 30
